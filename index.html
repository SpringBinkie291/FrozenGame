<body>
<div class="app">
  <div class="topbar panel"><button class="iconbtn" id="homeBtn">⌂</button><div class="brand">NeuroGlow</div><div class="spacer"></div><div class="pill">⭐ <span id="starBank">0</span></div><div class="pill">Lv <span id="topLevel">1</span></div></div>

  <section id="home" class="screen home active"><div class="homeCard panel"><div class="logo">NEUROGLOW<span>FROST CIRCUIT</span></div><p class="subtitle">Fast mobile-first match-3 with cognitive challenge bursts, escalating levels, special pieces, and Frostbyte.</p><div class="menuBtns"><button class="primary" id="playBtn">Play</button><button class="secondary" id="levelsBtn">Level Select</button><button class="secondary" id="closetBtn">Cosmetics</button><button class="secondary" id="resetBtn">Reset Progress</button></div></div></section>

  <section id="levels" class="screen levels"><div class="screenHead"><button class="iconbtn backHome">‹</button><div class="screenTitle">Frost Path</div></div><div class="levelScroll"><div id="levelPath" class="path"></div></div></section>

</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const screens={home:$('#home'),levels:$('#levels'),closet:$('#closet'),game:$('#game')};
const canvas=$('#board'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const N=8, TYPES=6, CELL=90;
const COLORS=['#41c8ff','#ff5c87','#ffd75e','#71e6a6','#9a78ff','#ff9c4a'];
const SHAPES=['circle','diamond','square','hex','drop','star'];
let state=load();
let board=[], level=1, score=0,moves=20,goal=3000,busy=false,drag=null,comboDepth=0,quizPending=false,lastFrame=0;
const recentQuestions=[]; let qDeck=[];
function load(){try{return Object.assign({unlocked:1,stars:0,ratings:{},owned:['classic'],equipped:'classic'},JSON.parse(localStorage.getItem('neuroglowFast')||'{}'))}catch{return {unlocked:1,stars:0,ratings:{},owned:['classic'],equipped:'classic'}}}
function save(){localStorage.setItem('neuroglowFast',JSON.stringify(state));updateTop()}
function updateTop(){$('#starBank').textContent=state.stars;$('#topLevel').textContent=state.unlocked}
function show(id){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[id].classList.add('active');if(id==='levels')renderLevels();if(id==='closet')renderCloset();}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1200)}
function randType(){return Math.floor(Math.random()*TYPES)}
function makeBoard(){board=Array.from({length:N},()=>Array(N).fill(0));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let t;do{t=randType()}while((c>1&&board[r][c-1].t===t&&board[r][c-2].t===t)||(r>1&&board[r-1][c].t===t&&board[r-2][c].t===t));board[r][c]={t,s:null}}}
function setupLevel(n){level=n;score=0;comboDepth=0;moves=Math.max(12,22-Math.floor((n-1)/3));goal=2600+n*680+Math.floor(n*n*24);makeBoard();updateHUD();draw();$('#speech').textContent='Swipe a gem to begin.';show('game')}
function updateHUD(){$('#hudLevel').textContent=level;$('#hudMoves').textContent=moves;$('#hudScore').textContent=score;$('#hudGoal').textContent=goal}
const SPRITES=new Map();
function gemKey(g){return g.t+'|'+(g.s||'')}
function buildGemSprite(g){let key=gemKey(g);if(SPRITES.has(key))return SPRITES.get(key);let o=document.createElement('canvas');o.width=o.height=CELL;let c=o.getContext('2d');let mid=CELL/2,s=CELL*.68;c.save();c.translate(mid,mid);let glow=c.createRadialGradient(-s*.2,-s*.28,2,0,0,s*.65);glow.addColorStop(0,'rgba(255,255,255,.9)');glow.addColorStop(.18,COLORS[g.t]);glow.addColorStop(1,'rgba(4,14,29,.25)');c.fillStyle=glow;c.strokeStyle='rgba(255,255,255,.72)';c.lineWidth=3;c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=5;c.shadowOffsetY=4;c.beginPath();let shape=SHAPES[g.t];if(shape==='circle'){c.arc(0,0,s*.48,0,Math.PI*2)}else if(shape==='diamond'){c.moveTo(0,-s*.52);c.lineTo(s*.48,0);c.lineTo(0,s*.52);c.lineTo(-s*.48,0);c.closePath()}else if(shape==='square'){roundRect(c,-s*.45,-s*.45,s*.9,s*.9,12)}else if(shape==='hex'){for(let i=0;i<6;i++){let a=Math.PI/3*i-Math.PI/6,px=Math.cos(a)*s*.48,py=Math.sin(a)*s*.48;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath()}else if(shape==='drop'){c.moveTo(0,-s*.55);c.bezierCurveTo(s*.52,-s*.08,s*.5,s*.4,0,s*.5);c.bezierCurveTo(-s*.5,s*.4,-s*.52,-s*.08,0,-s*.55);c.closePath()}else{for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rad=i%2?s*.22:s*.5,px=Math.cos(a)*rad,py=Math.sin(a)*rad;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath()}c.fill();c.shadowBlur=0;c.stroke();c.globalAlpha=.72;c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(-s*.17,-s*.22,s*.17,s*.09,-.5,0,Math.PI*2);c.fill();c.globalAlpha=1;if(g.s){c.lineWidth=6;c.strokeStyle=g.s==='prism'?'#fff3a0':'rgba(255,255,255,.95)';c.shadowColor=g.s==='prism'?'#ffe46e':'#86e8ff';c.shadowBlur=7;c.beginPath();if(g.s==='h'){c.moveTo(-s*.38,0);c.lineTo(s*.38,0)}else if(g.s==='v'){c.moveTo(0,-s*.38);c.lineTo(0,s*.38)}else if(g.s==='bomb'){c.arc(0,0,s*.22,0,Math.PI*2)}else if(g.s==='prism'){for(let i=0;i<8;i++){let a=i*Math.PI/4;c.moveTo(0,0);c.lineTo(Math.cos(a)*s*.36,Math.sin(a)*s*.36)}}c.stroke();c.shadowBlur=0}c.restore();SPRITES.set(key,o);return o}
function drawGem(x,y,size,g,alpha=1,scale=1){let sp=buildGemSprite(g);ctx.save();ctx.globalAlpha=alpha;if(scale!==1){ctx.translate(x+size/2,y+size/2);ctx.scale(scale,scale);ctx.drawImage(sp,-size/2,-size/2,size,size)}else ctx.drawImage(sp,x,y,size,size);ctx.restore()}
function draw(){ctx.fillStyle='#08182f';ctx.fillRect(0,0,720,720);if(!board||board.length!==N)return;for(let r=0;r<N;r++)for(let c=0;c<N;c++){let x=c*CELL,y=r*CELL;let even=(r+c)%2===0;ctx.fillStyle=even?'#102b4d':'#0d2543';roundRectPath(ctx,x+3,y+3,CELL-6,CELL-6,13);ctx.fill();ctx.fillStyle='rgba(255,255,255,.035)';roundRectPath(ctx,x+6,y+6,CELL-12,(CELL-12)*.36,10);ctx.fill();let g=board[r][c];if(!g)continue;if(drag&&drag.r===r&&drag.c===c)continue;drawGem(x,y,CELL,g)}if(drag){let g=board[drag.r][drag.c];if(g)drawGem(drag.x-CELL/2,drag.y-CELL/2,CELL,g,.96,1.08)}}
function roundRectPath(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function pointerPos(e){let rect=canvas.getBoundingClientRect();return {x:(e.clientX-rect.left)*720/rect.width,y:(e.clientY-rect.top)*720/rect.height}}
canvas.addEventListener('pointerdown',e=>{if(busy)return;canvas.setPointerCapture(e.pointerId);let p=pointerPos(e),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);if(r<0||r>=N||c<0||c>=N)return;drag={r,c,startX:p.x,startY:p.y,x:p.x,y:p.y,id:e.pointerId};draw()});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let p=pointerPos(e);drag.x=p.x;drag.y=p.y;draw()});
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;let p=pointerPos(e),dx=p.x-drag.startX,dy=p.y-drag.startY;let r2=drag.r,c2=drag.c;if(Math.max(Math.abs(dx),Math.abs(dy))>24){if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1}let r1=drag.r,c1=drag.c;drag=null;draw();if(r2>=0&&r2<N&&c2>=0&&c2<N&&(r1!==r2||c1!==c2))attemptSwap(r1,c1,r2,c2)});
canvas.addEventListener('pointercancel',()=>{drag=null;draw()});
function swap(r1,c1,r2,c2){let t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t}
function attemptSwap(r1,c1,r2,c2){if(busy)return;busy=true;swap(r1,c1,r2,c2);let a=board[r1][c1],b=board[r2][c2];if(a?.s||b?.s){moves--;activateSpecialSwap(r1,c1,r2,c2);resolveLoop(1);return}let groups=findGroups();if(!groups.length){swap(r1,c1,r2,c2);moves--;updateHUD();react('sad','No match — try another swipe.');draw();busy=false;checkEnd();return}moves--;resolveGroups(groups,{r:r2,c:c2});}
function findGroups(){let runs=[];for(let r=0;r<N;r++){let c=0;while(c<N){let g=board[r][c];if(!g){c++;continue}let j=c+1;while(j<N&&board[r][j]&&board[r][j].t===g.t)j++;if(j-c>=3)runs.push({dir:'h',cells:Array.from({length:j-c},(_,k)=>[r,c+k])});c=j}}for(let c=0;c<N;c++){let r=0;while(r<N){let g=board[r][c];if(!g){r++;continue}let j=r+1;while(j<N&&board[j][c]&&board[j][c].t===g.t)j++;if(j-r>=3)runs.push({dir:'v',cells:Array.from({length:j-r},(_,k)=>[r+k,c])});r=j}}if(!runs.length)return[];let sets=runs.map(x=>new Set(x.cells.map(([r,c])=>r+','+c))),used=new Set,groups=[];for(let i=0;i<runs.length;i++){if(used.has(i))continue;let merged=new Set(sets[i]),changed=true;used.add(i);while(changed){changed=false;for(let j=0;j<runs.length;j++)if(!used.has(j)){let overlap=[...sets[j]].some(k=>merged.has(k));if(overlap){sets[j].forEach(k=>merged.add(k));used.add(j);changed=true}}}let cells=[...merged].map(k=>k.split(',').map(Number));let hr=runs.filter(x=>x.dir==='h'&&x.cells.some(([r,c])=>merged.has(r+','+c))).map(x=>x.cells.length);let vr=runs.filter(x=>x.dir==='v'&&x.cells.some(([r,c])=>merged.has(r+','+c))).map(x=>x.cells.length);groups.push({cells,maxH:Math.max(0,...hr),maxV:Math.max(0,...vr),cross:hr.length&&vr.length})}return groups}
function resolveGroups(groups,origin){let clear=new Set(),creates=[];for(let g of groups){g.cells.forEach(([r,c])=>clear.add(r+','+c));let special=null;if(g.cross)special='bomb';else if(Math.max(g.maxH,g.maxV)>=5)special='prism';else if(g.maxH===4)special='h';else if(g.maxV===4)special='v';if(special){let pos=g.cells.find(([r,c])=>origin&&r===origin.r&&c===origin.c)||g.cells[Math.floor(g.cells.length/2)];creates.push({r:pos[0],c:pos[1],special,t:board[pos[0]][pos[1]].t});clear.delete(pos[0]+','+pos[1])}}clearCells(clear);creates.forEach(o=>board[o.r][o.c]={t:o.t,s:o.special});comboDepth++;score+=clear.size*(90+comboDepth*25);flashCombo(comboDepth,creates.some(x=>x.special));collapse();updateHUD();draw();setTimeout(()=>resolveLoop(comboDepth),55)}
function clearCells(set){for(let key of set){let [r,c]=key.split(',').map(Number);let g=board[r][c];if(!g)continue;if(g.s){expandSpecial(r,c,g,set)}board[r][c]=null}}
function expandSpecial(r,c,g,set){if(g.s==='h')for(let x=0;x<N;x++)set.add(r+','+x);if(g.s==='v')for(let y=0;y<N;y++)set.add(y+','+c);if(g.s==='bomb')for(let y=Math.max(0,r-1);y<=Math.min(N-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(N-1,c+1);x++)set.add(y+','+x);if(g.s==='prism'){let t=randType();for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(board[y][x]?.t===t)set.add(y+','+x)}}
function activateSpecialSwap(r1,c1,r2,c2){let set=new Set();let A=board[r1][c1],B=board[r2][c2];if(A?.s==='prism'||B?.s==='prism'){let prism=A?.s==='prism'?A:B,target=A?.s==='prism'?B:A;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]?.t===target.t)set.add(r+','+c);set.add(r1+','+c1);set.add(r2+','+c2)}else{set.add(r1+','+c1);set.add(r2+','+c2);if(A?.s)expandSpecial(r1,c1,A,set);if(B?.s)expandSpecial(r2,c2,B,set)}clearCells(set);score+=set.size*130;flashCombo(2,true);collapse();updateHUD();draw()}
function collapse(){for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(board[r][c])board[w--][c]=board[r][c];while(w>=0)board[w--][c]={t:randType(),s:null}}}
function resolveLoop(depth){let groups=findGroups();if(groups.length){resolveGroups(groups,null);return}comboDepth=0;busy=false;updateHUD();draw();if(Math.random()<.28&&score<goal&&!quizPending)openQuiz();else checkEnd()}
function flashCombo(n,special){let e=$('#comboText'),w=$('.canvasWrap');e.textContent=special?'POWER BURST!':n>2?'FROST FRENZY ×'+n:'COMBO ×'+n;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');w.classList.remove('burst');void w.offsetWidth;w.classList.add('burst');setTimeout(()=>w.classList.remove('burst'),240);react('react',special?'Power surge!':'Nice combo!')}
function react(cls,msg){let s=$('#snowman');s.classList.remove('react','sad','win');void s.offsetWidth;s.classList.add(cls);$('#speech').textContent=msg;setTimeout(()=>s.classList.remove(cls),650)}
function checkEnd(){if(score>=goal){let earned=moves>7?3:moves>2?2:1;state.ratings[level]=Math.max(state.ratings[level]||0,earned);state.stars+=earned;state.unlocked=Math.max(state.unlocked,level+1);save();react('win','Level clear!');$('#resultTitle').textContent='Level Clear!';$('#resultBody').textContent=`You earned ${earned} star${earned>1?'s':''}. Score: ${score.toLocaleString()}.`;$('#resultNext').style.display='';$('#resultModal').classList.add('show');busy=true}else if(moves<=0){$('#resultTitle').textContent='Out of Moves';$('#resultBody').textContent=`You reached ${score.toLocaleString()} / ${goal.toLocaleString()}.`;$('#resultNext').style.display='none';$('#resultModal').classList.add('show');busy=true}}
const QUESTIONS=[
['What does fNIRS primarily estimate?',['Changes in oxygenated and deoxygenated hemoglobin','Electrical spikes from single neurons','Skull thickness','Cerebrospinal fluid pressure'],0],
['Which cognitive function holds information briefly for active use?',['Working memory','Long-term storage','Visual acuity','Motor strength'],0],
['A dual-task condition is useful for studying what?',['How performance changes when attention is divided','Only visual color perception','Bone density','Hearing thresholds'],0],
['Slower responses over a long task can be one sign of what?',['Cognitive fatigue','Higher visual contrast','Improved hearing','Greater grip strength'],0],
['Why include a control group in a study?',['To provide a comparison condition','To guarantee significance','To eliminate all variability','To replace randomization'],0],
['What does reaction time measure most directly?',['Speed of responding after a stimulus','Memory capacity in years','Blood pressure','Vocabulary size'],0],
['Executive function commonly includes what?',['Planning, inhibition, and task switching','Only color vision','Only reflexes','Lung volume'],0],
['What kind of light does fNIRS use?',['Near-infrared light','Ultraviolet light','X-rays','Gamma rays'],0],
['In fNIRS, increased task-related activation is often associated with what pattern?',['A rise in oxygenated hemoglobin','A drop in skull size','Loss of all blood flow','Higher bone density'],0],
['Why randomize trial order?',['To reduce order effects','To make every score identical','To increase screen brightness','To remove the need for analysis'],0],
['What is cognitive flexibility?',['Ability to shift between rules or tasks','Ability to see in darkness','Ability to hear higher pitches','Ability to hold breath'],0],
['A Stroop-like task mainly challenges what?',['Selective attention and inhibition','Leg strength','Depth perception only','Hearing sensitivity'],0],
['What does accuracy measure?',['How often responses are correct','How fast a screen refreshes','How bright a display is','How loud audio is'],0],
['Why measure both speed and accuracy?',['They can trade off against each other','They are always identical','Only speed matters','Only accuracy matters'],0],
['What is a hemodynamic response?',['A blood-flow/oxygenation change linked to neural activity','A muscle twitch','A sound wave','A retinal reflex'],0],
['Which brain region is often studied during executive tasks with fNIRS?',['Prefrontal cortex','Femur','Retina only','Inner ear'],0],
['What can repeated trials help estimate?',['Consistency and variability of performance','Exact future behavior','Bone age','Hair growth'],0],
['Why might long tasks reveal deficits missed by short tasks?',['Fatigue effects may emerge over time','Screens get larger','Questions become physically heavier','Colors stop existing'],0],
['What does task switching require?',['Changing from one rule set to another','Ignoring every stimulus','Only memorizing one item','Keeping one response forever'],0],
['A higher cognitive load usually means what?',['More mental resources are required','The device weighs more','The room is louder','The monitor is brighter'],0],
['What is processing speed?',['How quickly information can be understood and acted on','How quickly blood is drawn','How fast a monitor charges','How quickly someone walks'],0],
['Why record errors as well as response time?',['Fast responses may be inaccurate','Errors never matter','Timing replaces accuracy','It measures screen size'],0],
['What does within-subject comparison mean?',['The same participant completes multiple conditions','Only different hospitals are compared','Only one trial is used','No repeated measurement occurs'],0],
['Why avoid repeating identical questions too often?',['Participants may memorize answers rather than engage the task','It increases oxygen automatically','It makes controls unnecessary','It changes monitor resolution'],0]
];
function nextQuestion(){if(!qDeck.length){qDeck=QUESTIONS.map((_,i)=>i);for(let i=qDeck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qDeck[i],qDeck[j]]=[qDeck[j],qDeck[i]]}}let idx=qDeck.find(i=>!recentQuestions.includes(i));if(idx===undefined){recentQuestions.splice(0,4);idx=qDeck[0]}qDeck=qDeck.filter(i=>i!==idx);recentQuestions.push(idx);if(recentQuestions.length>8)recentQuestions.shift();return QUESTIONS[idx]}
function openQuiz(){quizPending=true;let [q,ans,correct]=nextQuestion();$('#quizQ').textContent=q;let box=$('#answers');box.innerHTML='';let order=ans.map((a,i)=>({a,i})).sort(()=>Math.random()-.5);order.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o.a;b.onclick=()=>{[...box.children].forEach(x=>x.disabled=true);if(o.i===correct){b.classList.add('correct');score+=500;react('react','Correct! +500');}else{b.classList.add('wrong');moves=Math.max(0,moves-1);react('sad','Not quite — one move lost.');}updateHUD();setTimeout(()=>{$('#quizModal').classList.remove('show');quizPending=false;checkEnd()},350)};box.appendChild(b)});$('#quizModal').classList.add('show')}
const COS=[['classic','Classic Frost','#15395f','#55d9ff',0],['ember','Ember','#4d1f2a','#ff775d',3],['aurora','Aurora','#153d39','#72f0b1',4],['royal','Royal','#311d5a','#a889ff',5],['sunrise','Sunrise','#5a3c16','#ffd563',6],['berry','Berry','#571f46','#ff70b4',6],['ocean','Ocean','#12395b','#64caff',7],['mint','Mint','#184839','#7bf4c0',7],['midnight','Midnight','#101426','#5268ff',8],['coral','Coral','#5d2a27','#ff8a72',8],['plasma','Plasma','#37145b','#da72ff',9],['prismatic','Prismatic','#2e315a','#fff18d',12]];
function applyCosmetic(){let c=COS.find(x=>x[0]===state.equipped)||COS[0];document.documentElement.style.setProperty('--hat',c[2]);$('.hat').style.background=`linear-gradient(${c[2]},#0b1c34)`;$('.scarf').style.background=c[3]}
function renderCloset(){let g=$('#closetGrid');g.innerHTML='';COS.forEach(([id,name,a,b,cost])=>{let own=state.owned.includes(id),eq=state.equipped===id;let d=document.createElement('div');d.className='cosmetic';d.innerHTML=`<div class="swatch" style="background:linear-gradient(135deg,${a},${b})"></div><h3>${name}</h3><p>${cost?cost+' stars':'Starter look'}</p><button class="buy ${eq?'equipped':''}">${eq?'Equipped':own?'Equip':`Redeem · ${cost} ⭐`}</button>`;d.querySelector('button').onclick=()=>{if(eq)return;if(own){state.equipped=id;save();applyCosmetic();renderCloset()}else if(state.stars>=cost){state.stars-=cost;state.owned.push(id);state.equipped=id;save();applyCosmetic();renderCloset()}else toast('Not enough stars yet')};g.appendChild(d)})}
function renderLevels(){let p=$('#levelPath');p.innerHTML='';for(let i=1;i<=Math.max(40,state.unlocked+8);i++){let b=document.createElement('button');b.className='levelNode'+(i>state.unlocked?' locked':'');b.innerHTML=i+`<div class="stars">${'★'.repeat(state.ratings[i]||0)}${'☆'.repeat(3-(state.ratings[i]||0))}</div>`;if(i<=state.unlocked)b.onclick=()=>setupLevel(i);p.appendChild(b)}}
$('#playBtn').onclick=()=>setupLevel(state.unlocked);$('#levelsBtn').onclick=()=>show('levels');$('#closetBtn').onclick=()=>show('closet');$('#homeBtn').onclick=()=>show('home');$$('.backHome').forEach(b=>b.onclick=()=>show('home'));$('#quitBtn').onclick=()=>show('levels');$('#hintBtn').onclick=()=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let [dr,dc] of [[0,1],[1,0]]){let rr=r+dr,cc=c+dc;if(rr>=N||cc>=N)continue;swap(r,c,rr,cc);let ok=findGroups().length;swap(r,c,rr,cc);if(ok){toast(`Try the gem near row ${r+1}, column ${c+1}`);return}}toast('No easy hint — reshuffling');makeBoard();draw()};$('#resultMap').onclick=()=>{$('#resultModal').classList.remove('show');busy=false;show('levels')};$('#resultNext').onclick=()=>{$('#resultModal').classList.remove('show');busy=false;setupLevel(level+1)};$('#resetBtn').onclick=()=>{if(confirm('Reset all NeuroGlow progress?')){localStorage.removeItem('neuroglowFast');state=load();updateTop();applyCosmetic();toast('Progress reset')}};
window.addEventListener('resize',()=>draw(),{passive:true});updateTop();applyCosmetic();renderLevels();makeBoard();draw();
})();
